[project]
name = "skill-md-native"
version = "0.1.0"
description = "Runtime-verified evidence and ranking layer for Agent Skills"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "cryptography>=46,<50",
]

[project.optional-dependencies]
browser = [
  "playwright==1.61.0",
]

[project.scripts]
skill-native = "skill_native.cli:main"
skill-native-coding-runner = "skill_native.coding_agent:main"
skill-native-browser-runner = "skill_native.browser_runner:main"
skill-native-run-artifacts = "skill_native.run_artifacts:main"
skill-native-attest = "skill_native.attestation_cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_native"]
