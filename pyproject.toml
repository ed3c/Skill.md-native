[project]
name = "skill-md-native"
version = "0.1.0"
description = "Runtime-verified evidence and ranking layer for Agent Skills"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.scripts]
skill-native = "skill_native.cli:main"
skill-native-coding-runner = "skill_native.coding_agent:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_native"]
