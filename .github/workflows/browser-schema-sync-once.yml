name: browser-schema-sync-once

on:
  push:
    branches:
      - agent/27-browser-playwright-harness

permissions:
  contents: write

jobs:
  sync-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/27-browser-playwright-harness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install contract dependencies
        run: python -m pip install -e .
      - name: Generate all committed schemas
        run: |
          rm -rf /tmp/all-schemas
          mkdir -p /tmp/all-schemas
          skill-native export-harness-schemas /tmp/all-schemas
          skill-native-run-artifacts export-schemas /tmp/all-schemas
          skill-native-attest export-schemas /tmp/all-schemas
          cp /tmp/all-schemas/*.json schemas/
      - name: Remove this one-shot workflow and commit
        run: |
          git rm .github/workflows/browser-schema-sync-once.yml
          git config user.name 'skill-native-schema-bot'
          git config user.email 'skill-native-schema-bot@users.noreply.github.com'
          git add schemas
          git commit -m 'schema: finalize Browser Harness contracts'
          git push origin HEAD:agent/27-browser-playwright-harness
