name: schema-sync-pr

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/27-browser-playwright-harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install contract dependencies
        run: python -m pip install -e .
      - name: Generate all committed schemas
        run: |
          rm -rf /tmp/all-schemas
          mkdir -p /tmp/all-schemas
          skill-native export-harness-schemas /tmp/all-schemas
          skill-native-run-artifacts export-schemas /tmp/all-schemas
          skill-native-attest export-schemas /tmp/all-schemas
          cp /tmp/all-schemas/*.json schemas/
      - name: Commit generated schemas when changed
        run: |
          if git diff --quiet -- schemas; then
            echo 'Schemas already synchronized.'
            exit 0
          fi
          git config user.name 'skill-native-schema-bot'
          git config user.email 'skill-native-schema-bot@users.noreply.github.com'
          git add schemas
          git commit -m 'schema: sync Browser Harness contracts'
          git push origin HEAD:${{ github.head_ref }}
