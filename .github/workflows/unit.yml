name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic Coding Agent Harness
        run: |
          python -m unittest \
            tests.test_coding_agent \
            tests.test_runtime_harness_controllers \
            -v
      - name: Verify deterministic Run Artifact Bundle
        run: python -m unittest tests.test_run_artifacts -v
      - name: Compile smoke policy
        run: skill-native compile-openshell-policy examples/run.openshell.yaml > /tmp/openshell-policy.yaml
      - name: Materialize adversarial fixtures
        run: skill-native materialize-fixtures /tmp/fixtures
      - name: Verify committed schemas
        run: |
          skill-native export-harness-schemas /tmp/all-schemas
          skill-native-run-artifacts export-schemas /tmp/all-schemas
          diff -ru schemas /tmp/all-schemas
      - name: Validate and compile Harness fixtures
        run: |
          skill-native validate-harness examples/harnesses/coding/harness.yaml > /tmp/harness-manifest.json
          skill-native plan-harness \
            examples/harnesses/coding/harness.yaml \
            examples/harnesses/coding/run.fake.yaml > /tmp/harness-plan.json
          skill-native validate-harness \
            examples/harnesses/coding-agent/harness.yaml > /tmp/coding-agent-manifest.json
          skill-native plan-harness \
            examples/harnesses/coding-agent/harness.yaml \
            examples/harnesses/coding-agent/run.fake.yaml > /tmp/coding-agent-plan.json
      - name: Run deterministic Harness fixture
        run: |
          skill-native run-harness-fake \
            examples/harnesses/coding/harness.yaml \
            examples/harnesses/coding/run.fake.yaml \
            --evidence-dir /tmp/harness-evidence \
            --verdict-dir /tmp/harness-verdicts > /tmp/harness-result.json
          test "$(find /tmp/harness-evidence -type f | wc -l)" -eq 1
          test "$(find /tmp/harness-verdicts -type f | wc -l)" -eq 1
      - name: Build deterministic Run Artifact Bundle fixture
        run: |
          skill-native-run-artifacts build \
            --authority examples/run-artifacts/authority.json \
            --plan examples/run-artifacts/plan.json \
            --evidence examples/run-artifacts/evidence.json \
            --verdict examples/run-artifacts/verdict.json \
            --output /tmp/run-artifacts > /tmp/run-artifacts-result.json
          test "$(find /tmp/run-artifacts -name '*.json' -type f | wc -l)" -eq 6

  cloudflare-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [cloudflare/worker, cloudflare/dynamic-worker]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package.json
      - run: npm install --ignore-scripts
      - run: npm run typecheck
