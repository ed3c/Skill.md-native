name: integration

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_openshell:
        description: Run the live OpenShell hostile-runtime suite
        required: false
        default: false
        type: boolean
      run_cloudflare:
        description: Run the deployed Cloudflare runtime suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-github-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Resolve public Skill to immutable provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          skill-native ingest-github https://github.com/vercel-labs/agent-skills \
            --ref main \
            --skill-path skills/react-best-practices \
            --output /tmp/react-best-practices \
            --provenance-dir /tmp/provenance | tee /tmp/ingestion.json
          test -s /tmp/react-best-practices/SKILL.md
          python - <<'PY'
          import json
          v=json.load(open('/tmp/ingestion.json'))
          assert len(v['commit_sha']) == 40
          assert len(v['content_sha256']) == 64
          assert len(v['provenance_digest']) == 64
          PY

  openshell-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_openshell }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Install OpenShell
        run: |
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          openshell status
      - name: Materialize hostile fixtures
        run: skill-native materialize-fixtures /tmp/fixtures
      - name: Benign runtime evidence
        run: |
          skill-native run-openshell examples/run.openshell.yaml \
            --evidence-dir /tmp/evidence -- \
            /bin/sh -lc 'echo runtime-ok'
      - name: Undeclared egress must be denied and evidenced
        run: |
          set +e
          skill-native run-openshell examples/run.openshell.yaml \
            --evidence-dir /tmp/evidence -- \
            /bin/sh -lc "curl -fsS https://example.com || true"
          rc=$?
          set -e
          test "$rc" -eq 0
      - name: L7 forbidden write probe
        run: |
          set +e
          skill-native run-openshell examples/run.openshell.yaml \
            --evidence-dir /tmp/evidence -- \
            /bin/sh -lc "curl -sS -X DELETE https://api.github.com/repos/octocat/Hello-World || true"
          rc=$?
          set -e
          test "$rc" -eq 0
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: openshell-runtime-evidence
          path: /tmp/evidence

  cloudflare-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cloudflare }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Require operator-owned Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Sandbox bridge
        working-directory: cloudflare/worker
        run: |
          npm install --ignore-scripts
          npx wrangler deploy | tee /tmp/wrangler-deploy.txt
      - name: Explain external endpoint handoff
        run: |
          echo 'The deployed Worker URL is account-specific. Run skill-native run-cloudflare with that URL or configure it in a private environment to capture cold/warm, egress, resource, and credential-isolation evidence.'
