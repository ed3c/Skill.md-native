name: capability-audit

on:
  push:
    branches:
      - 'agent/42-capability-audit-*'
  pull_request:
    paths:
      - '.github/workflows/capability-audit.yml'
      - 'audit/**'
      - 'examples/harnesses/browser/**'
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-audit-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      AUDIT_OUTPUT: .skill-native/capability-audit
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install package and Browser runtime
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium

      - name: Execute full capability contract
        id: audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python audit/run.py \
            --output "$AUDIT_OUTPUT" \
            --clean \
            --full
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish zero-access job summary
        if: always()
        run: |
          if test -f "$AUDIT_OUTPUT/summary.md"; then
            cat "$AUDIT_OUTPUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' \
              '# Skill.md-native capability audit' \
              '' \
              'The audit did not produce summary.md. Inspect the step logs.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify local evidence manifest
        if: always()
        run: |
          test -f "$AUDIT_OUTPUT/SHA256SUMS"
          (
            cd "$AUDIT_OUTPUT"
            sha256sum -c SHA256SUMS
          )

      - name: Upload capability evidence packet
        id: evidence_artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-native-capability-audit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Publish artifact receipt
        if: always() && steps.evidence_artifact.outcome == 'success'
        run: |
          {
            printf '\n## Published evidence artifact\n\n'
            printf -- '- Artifact ID: `%s`\n' '${{ steps.evidence_artifact.outputs.artifact-id }}'
            printf -- '- Artifact URL: %s\n' '${{ steps.evidence_artifact.outputs.artifact-url }}'
            printf -- '- Artifact digest: `%s`\n' '${{ steps.evidence_artifact.outputs.artifact-digest }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required capability states
        if: always()
        run: |
          test -f "$AUDIT_OUTPUT/capability-audit-result.json"
          test "${{ steps.audit.outputs.exit_code }}" = "0"
          test -n "${{ steps.evidence_artifact.outputs.artifact-id }}"
          test -n "${{ steps.evidence_artifact.outputs.artifact-digest }}"
